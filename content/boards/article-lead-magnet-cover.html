<!doctype html>
<html><head><meta charset="utf-8">
<title>Article cover 5:2 — the lead magnet machine</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=JetBrains+Mono:wght@400;700&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1500px; height:600px; font-family:'Inter',sans-serif; overflow:hidden; }

  .banner { width:1500px; height:600px; display:flex; flex-direction:column; background:#1B4332; }

  .band { height:86px; background:#B7E4C7; border-bottom:6px solid #1B4332;
          display:flex; align-items:center; justify-content:space-between; padding:0 54px; flex:none; }
  .band .k { font-family:'JetBrains Mono',monospace; font-size:20px; font-weight:700; letter-spacing:2.5px; color:#1B4332; }
  .band .h { font-size:22px; font-weight:800; color:#1B4332; }

  .body { flex:1; padding:44px 54px 40px; display:flex; flex-direction:column; }

  .blocks { flex:1; display:flex; align-items:stretch; gap:14px; }
  .blk { border-radius:14px; padding:26px 24px; display:flex; flex-direction:column; justify-content:space-between; }
  .blk .pct { font-size:66px; font-weight:800; line-height:1; letter-spacing:-2px; }
  .blk .nm  { font-family:'JetBrains Mono',monospace; font-size:19px; font-weight:700; letter-spacing:2px; }

  .post  { flex:50; background:#52B788; color:#0F2E20; }
  .dm    { flex:25; background:#B7E4C7; color:#1B4332; }
  .asset { flex:15; background:#D8F3DC; color:#1B4332; border-bottom:8px solid #E9B949; }
  .rest  { flex:10; background:#2C5443; color:#B7E4C7; }
  .rest .pct { font-size:30px; }
  .rest .nm { font-size:15px; letter-spacing:1.4px; }
  .asset .pct { font-size:54px; }
  .asset .nm { font-size:17px; letter-spacing:1.4px; }

  .under { display:flex; align-items:center; gap:14px; margin-top:24px; }
  .under .left { flex:79; display:flex; align-items:center; gap:20px; }
  .under .right { flex:21; display:flex; align-items:center; gap:10px; }
  .under .tag { background:#E9B949; color:#1B4332; font-family:'JetBrains Mono',monospace; font-size:15px;
                font-weight:700; padding:8px 12px; border-radius:6px; line-height:1.15; }
  .under .rule { flex:1; height:3px; background:#52B788; opacity:.5; }
  .under .why { font-family:'JetBrains Mono',monospace; font-size:17px; color:#B7E4C7; white-space:nowrap; }
</style></head>
<body>
  <div class="banner">
    <div class="band">
      <div class="k">A LEAD MAGNET, DRAWN TO SCALE</div>
      <div class="h">@maurojpelle</div>
    </div>
    <div class="body">
      <div class="blocks">
        <div class="blk post"><div class="nm">THE POST</div><div class="pct">~50%</div></div>
        <div class="blk dm"><div class="nm">THE DM</div><div class="pct">~25%</div></div>
        <div class="blk asset"><div class="nm">THE ASSET</div><div class="pct">~15%</div></div>
        <div class="blk rest"><div class="nm">LP + P.S.</div><div class="pct">rest</div></div>
      </div>
      <div class="under">
        <div class="left">
          <div class="why">3 magnets a week, 18 months</div>
          <div class="rule"></div>
        </div>
        <div class="right">
          <svg width="22" height="30" viewBox="0 0 22 30"><line x1="11" y1="30" x2="11" y2="11" stroke="#E9B949" stroke-width="3"/><polygon points="4,13 18,13 11,1" fill="#E9B949"/></svg>
          <div class="tag">where everyone<br>spends the week</div>
        </div>
      </div>
    </div>
  </div>
</body></html>
