<!-- Format C terminal board, doc 11-claude-code-content-system.md. Numbers: brand/claims.md only. Built by build.py in this folder. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B1A12;--pane:#0F2219;--side:#0C1D15;--line:#1F3A2C;--txt:#DCE8DF;--muted:#86A293;--acc:#E9B949;--green:#52B788;--red:#F2555A}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#050B08;overflow:hidden}
body{font-family:'Inter',-apple-system,'Helvetica Neue',Arial,sans-serif;color:var(--txt);-webkit-font-smoothing:antialiased}
.mono,pre,code{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
#stage{width:1600px;height:900px;position:absolute;left:50%;top:50%;transform-origin:center center;background:var(--bg);display:grid;
 grid-template-rows:34px 1fr 128px 28px;overflow:hidden}
.titlebar{display:flex;align-items:center;gap:9px;padding:0 16px;background:#081510;border-bottom:1px solid var(--line);font:600 14px 'JetBrains Mono',monospace;color:var(--muted)}
.titlebar i{width:12px;height:12px;border-radius:50%;display:inline-block;background:#2B4637}
.titlebar i:nth-child(1){background:#E5484D}.titlebar i:nth-child(2){background:#E9B949}.titlebar i:nth-child(3){background:#52B788}
.titlebar span{margin-left:auto;margin-right:auto;transform:translateX(-30px)}
.mid{display:grid;grid-template-columns:318px 1fr;min-height:0}
.side{background:var(--side);border-right:1px solid var(--line);padding:14px 0;overflow:hidden;font:500 15.5px/1.62 'JetBrains Mono',monospace}
.side .h{font:700 12px 'JetBrains Mono',monospace;letter-spacing:.16em;color:var(--muted);padding:0 18px 8px;text-transform:uppercase}
.side .r{white-space:pre;padding:0 18px;color:#A9BDB0;transition:background .25s,color .25s}
.side .r.on{background:#1C3A2A;color:#fff;box-shadow:inset 3px 0 0 var(--acc)}
.side .r.dir{color:#D3E2D8}
.side .r.red{color:#6C8576;font-style:italic}
.main{display:grid;grid-template-rows:40px 1fr;min-width:0;min-height:0;background:var(--pane)}
.tabs{display:flex;align-items:flex-end;background:#0B1C14;border-bottom:1px solid var(--line);padding-left:6px;gap:2px}
.tab{font:600 14px 'JetBrains Mono',monospace;color:var(--muted);padding:10px 18px;border-top:2px solid transparent}
.tab.on{background:var(--pane);color:#fff;border-top-color:var(--acc)}
.content{position:relative;padding:26px 34px 18px;min-height:0;overflow:hidden}
.term{font:500 21px/1.55 'JetBrains Mono',monospace;white-space:pre-wrap;word-break:break-word;color:#CFDDD4}
.term .p{color:var(--green);font-weight:700}
.term .c{color:#fff;font-weight:700}
.cursor{display:inline-block;width:11px;height:24px;background:var(--acc);vertical-align:-4px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.ed{font:500 19.5px/1.62 'JetBrains Mono',monospace;white-space:pre-wrap;word-break:break-word}
.ed .ln{display:grid;grid-template-columns:52px 1fr;gap:16px;padding:1px 10px 1px 0;border-left:3px solid transparent;transition:background .4s,opacity .4s}
.ed .ln b{color:#4E6A5A;font-weight:500;text-align:right}
.ed.focus .ln{opacity:.38}
.ed.focus .ln.hl{opacity:1;background:#2A2410;border-left-color:var(--acc);color:#fff}
.m-hl{background:var(--acc);color:#0B1A12;padding:0 4px;border-radius:3px;font-weight:800}
.m-dim{color:#5F7C6B}.m-red{color:var(--red);font-weight:700}.m-g{color:var(--green);font-weight:700}.m-y{color:var(--acc);font-weight:700}.m-b{color:#fff;font-weight:800}
.m-strike{text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:3px;color:#9AB0A2}
.split{display:grid;grid-template-columns:1fr 1fr;gap:34px;height:100%}
.split>div{min-width:0;overflow:hidden}
.chartwrap{display:flex;flex-direction:column;justify-content:center;height:100%}
.vstack{display:flex;flex-direction:column}
.src{margin-top:16px;font:500 14px 'JetBrains Mono',monospace;color:var(--muted)}
svg.chart{max-width:100%;height:auto;overflow:visible}
svg.chart .bar{animation:grow .55s ease-out both}
@keyframes grow{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
.tiles{display:grid;gap:18px}
.tile{background:#12301F;border:2px solid #2C5640;border-radius:8px;padding:18px 22px}
.tile.on{border-color:var(--acc);background:#2A2410}
.tk{font:700 13px 'JetBrains Mono',monospace;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.tv{font:800 50px 'JetBrains Mono',monospace;color:#fff;margin-top:8px;letter-spacing:-.02em}
.tile.on .tv{color:var(--acc)}
.tl{font-size:18px;color:#B9CCBF;margin-top:6px;font-weight:600}
.needs{position:absolute;right:26px;bottom:14px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;z-index:5}
.needs div{background:var(--red);color:#fff;font:800 15px 'JetBrains Mono',monospace;padding:6px 12px;border-radius:4px}
.cap{display:flex;align-items:center;gap:26px;padding:0 44px;background:#081510;border-top:1px solid var(--line)}
.cap .k{font:800 15px 'JetBrains Mono',monospace;letter-spacing:.14em;color:#0B1A12;background:var(--acc);padding:7px 12px;border-radius:4px;white-space:nowrap;text-transform:uppercase}
.cap .t{font-size:52px;font-weight:900;letter-spacing:-.025em;color:#fff;line-height:1.05}
.cap .t em{font-style:normal;color:var(--acc)}
.status{display:flex;align-items:center;gap:22px;padding:0 16px;background:#174A33;font:600 13.5px 'JetBrains Mono',monospace;color:#D7EADF}
.status .r{margin-left:auto}
.cta{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;text-align:center}
.cta .a{font-size:64px;font-weight:900;color:#fff;letter-spacing:-.02em}
.cta .b{font:800 40px 'JetBrains Mono',monospace;color:#0B1A12;background:var(--acc);padding:16px 30px;border-radius:6px}
#notes{position:fixed;left:0;right:0;bottom:0;max-height:62vh;overflow:auto;background:rgba(8,16,12,.97);border-top:3px solid var(--acc);
 padding:22px 34px;font:500 19px/1.55 'Inter',sans-serif;color:#E8F0EA;display:none;z-index:50}
#notes.on{display:block}
#notes h4{font:700 14px 'JetBrains Mono',monospace;letter-spacing:.14em;color:var(--acc);margin-bottom:8px}
#hint{position:fixed;right:10px;top:8px;font:500 11px 'JetBrains Mono',monospace;color:#3D5A4A;z-index:40}
</style></head>

t thing the agent reads every time it runs.", "left": {"kind": "file", "lines": ["---", "name: performance-loop", "description: Weekly performance loop. Consolidates the X and Calendly exports, computes reach and above-floor bookings per account, and flags drops before they become quarters. <span class=\"m-dim\">...</span>", "tools: Bash, Read, Write, Edit, Grep, Glob", "---", "", "You are the performance loop. You exist because **<span class=\"m-red\">[redacted</span>]'s monthly impressions fell 64%", "between June and August 2026 and nobody noticed for two months.** Your job is to make that", "impossible to repeat."], "hl": [7, 8, 9], "start": 1}, "tabs": [".claude/agents/performance-loop.md"], "tabOn": 0, "on": [12], "needs": [], "status": ".claude/agents/performance-loop.md"}, {"sec": "02 agents", "t": "10:40-11:40", "mins": 1.0, "caption": "Before: the drop sat unseen", "notes": "ON SCREEN: June indexed to 100, August at 36.<br>SAY: I only publish the percentage, so this is indexed to June. June is 100. August is 36. Two months of that, and the weekly numbers looked normal enough that nobody stopped.", "left": {"kind": "chart", "html": "<div style=\"display:grid;grid-template-columns:640px 1fr;gap:40px;align-items:center\"><svg class=\"chart\" width=\"640\" height=\"440\" viewBox=\"0 0 640 440\" role=\"img\"><g class=\"bar\" style=\"animation-delay:0ms\"><title>June 2026: 100</title><rect x=\"100.0\" y=\"70.0\" width=\"170\" height=\"314.0\" rx=\"4\" fill=\"#5E8C73\"/><text x=\"185.0\" y=\"46.0\" font-family=\"JetBrains Mono, sans-serif\" font-size=\"34\" font-weight=\"800\" fill=\"#DCE8DF\" text-anchor=\"middle\" dominant-baseline=\"middle\" >100</text><text x=\"185.0\" y=\"414\" font-family=\"Inter, sans-serif\" font-size=\"21\" font-weight=\"600\" fill=\"#DCE8DF\" text-anchor=\"middle\" dominant-baseline=\"middle\" >June 2026</text></g><g class=\"bar\" style=\"animation-delay:90ms\"><title>August 2026: 36</title><rect x=\"370.0\" y=\"271.0\" width=\"170\" height=\"113.0\" rx=\"4\" fill=\"#E9B949\"/><text x=\"455.0\" y=\"246.96000000000004\" font-family=\"JetBrains Mono, sans-serif\" font-size=\"34\" font-weight=\"800\" fill=\"#E9B949\" text-anchor=\"middle\" dominant-baseline=\"middle\" >36</text><text x=\"455.0\" y=\"414\" font-family=\"Inter, sans-serif\" font-size=\"21\" font-weight=\"600\" fill=\"#DCE8DF\" text-anchor=\"middle\" dominant-baseline=\"middle\" >August 2026</text></g><line x1=\"0\" y1=\"384\" x2=\"640\" y2=\"384\" stroke=\"#86A293\" stroke-width=\"2\"/></svg><div class=\"tiles\" style=\"grid-template-columns:repeat(1,1fr)\"><div class=\"tile on\"><div class=\"tk\">unnoticed for</div><div class=\"tv\">2 months</div><div class=\"tl\">the reason this agent exists</div></div></div></div><div class=\"src\">indexed, June = 100 · derived from the published 64% · brand/claims.md</div>"}, "tabs": ["impressions-indexed.svg"], "tabOn": 0, "on": [12], "needs": [], "status": ".claude/agents/performance-loop.md"}, {"sec": "02 agents", "t": "11:40-12:40", "mins": 1.0, "caption": "After: it flags the drop <em>unprompted</em>", "notes": "ON SCREEN: the flag list in the agent file.<br>SAY: After. Every run, it compares the latest week and month against the trailing four. And it flags these without being asked. The one in yellow is the one that was missed.", "left": {"kind": "file", "lines": ["## What you flag, unprompted", "", "- **Any account down more than 20% on impressions** against its trailing four-week average.", "- **Any account down more than 40%** against its own peak month. This is the one that was missed.", "- Above-floor bookings down more than 25% month on month.", "- A week with zero output on any account.", "- Exports that have not been refreshed in over 14 days."], "hl": [22], "start": 19}, "tabs": [".claude/agents/performance-loop.md"], "tabOn": 0, "on": [12], "needs": [], "status": ".claude/agents/performance-loop.md"}, {"sec": "02 agents", "t": "12:40-13:40", "mins": 1.0, "caption": "A missed ask, in a two-message DM", "notes": "ON SCREEN: why signal-sweep exists. The target number and the names are redacted.<br>SAY: Agent two. A week's catch-up missed a two-message group DM that held one key number, and it presented an auto-generated queue as if it were the priority list. Both failures were structural. Now the agent reads every channel and outputs a ranked list of asks.", "left": {"kind": "file", "lines": ["You keep track of what people actually asked Mauro to do. Chat history is the source, the repo is the memory, and your output is a ranked list of asks, not a summary of conversations.", "", "This exists because on 2026-08-14 a week's catch-up missed a two-message group DM containing <span class=\"m-red\">[redacted: one key number</span>], and presented an auto-generated Notion queue as if it were <span class=\"m-red\">[redacted</span>]'s priorities. Both failures are structural and this agent is the fix."], "hl": [10], "start": 8}, "tabs": [".claude/agents/signal-sweep.md"], "tabOn": 0, "on": [13], "needs": [], "status": ".claude/agents/signal-sweep.md"}, {"sec": "02 agents", "t": "13:40-14:40", "mins": 1.0, "caption": "15 checks. Can this be read aloud?", "notes": "ON SCREEN: board-qa on the left, the fifteen gates on the right.<br>SAY: Agent three. Boards were going out full rather than recordable. This one answers one question through fifteen checks: can this be read to camera without stopping. The first four are blockers, the run stops there. About half run as a script, the rest need eyes.", "left": {"kind": "file", "lines": ["You answer one question: **is this lane recordable?**", "", "Not built, not full, not finished. Recordable means <span class=\"m-red\">[redacted</span>] can sit down, open it, and read the", "whole thing to camera without stopping to ask what goes in a grey box or where a number came from."], "hl": [7], "start": 7}, "tabs": [".claude/agents/board-qa.md"], "tabOn": 0, "on": [14], "needs": [], "status": ".claude/agents/board-qa.md",  text-anchor=\"middle\" dominant-baseline=\"middle\" font-family=\"JetBrains Mono\" font-size=\"28\" font-weight=\"800\" fill=\"#DCE8DF\">6</text></g><g class=\"bar\" style=\"animation-delay:240ms\"><rect x=\"112\" y=\"102\" width=\"92\" height=\"82\" rx=\"6\" fill=\"#12301F\" stroke=\"#52B788\" stroke-width=\"2.5\"/><text x=\"158\" y=\"144\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-family=\"JetBrains Mono\" font-size=\"28\" font-weight=\"800\" fill=\"#DCE8DF\">7</text></g><g class=\"bar\" style=\"animation-delay:280ms\"><rect x=\"220\" y=\"102\" width=\"92\" height=\"82\" rx=\"6\" fill=\"#12301F\" stroke=\"#52B788\" stroke-width=\"2.5\"/><text x=\"266\" y=\"144\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-family=\"JetBrains Mono\" font-size=\"28\" font-weight=\"800\" fill=\"#DCE8DF\">8</text></g><g class=\"bar\" style=\"animation-delay:320ms\"><rect x=\"328\" y=\"102\" width=\"92\" height=\"82\" rx=\"6\" fill=\"#12301F\" stroke=\"#52B788\" stroke-width=\"2.5\"/><text x=\"374\" y=\"144\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-family=\"JetBrains Mono\" font-size=\"28\" font-weight=\"800\" fill=\"#DCE8DF\">9</text></g><g class=\"bar\" style=\"animation-delay:360ms\"><rect x=\"436\" y=\"102\" width=\"92\" height=\"82\" rx=\"6\" fill=\"#12301F\" stroke=\"#52B788\" stroke-width=\"2.5\"/><text x=\"482\" y=\"144\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-family=\"JetBrains Mono\" font-size=\"28\" font-weight=\"800\" fill=\"#DCE8DF\">10</text></g><g class=\"bar\" style=\"animation-delay:400ms\"><rect x=\"4\" y=\"200\" width=\"92\" height=\"82\" rx=\"6\" fill=\"#12301F\" stroke=\"#52B788\" stroke-width=\"2.5\"/><text x=\"50\" y=\"242\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-family=\"JetBrains Mono\" font-size=\"28\" font-weight=\"800\" fill=\"#DCE8DF\">11</text></g><g class=\"bar\" style=\"animation-delay:440ms\"><rect x=\"112\" y=\"200\" width=\"92\" height=\"82\" rx=\"6\" fill=\"#12301F\" stroke=\"#52B788\" stroke-width=\"2.5\"/><text x=\"158\" y=\"242\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-family=\"JetBrains Mono\" font-size=\"28\" font-weight=\"800\" fill=\"#DCE8DF\">12</text></g><g class=\"bar\" style=\"animation-delay:480ms\"><rect x=\"220\" y=\"200\" width=\"92\" height=\"82\" rx=\"6\" fill=\"#12301F\" stroke=\"#52B788\" stroke-width=\"2.5\"/><text x=\"266\" y=\"242\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-family=\"JetBrains Mono\" font-size=\"28\" font-weight=\"800\" fill=\"#DCE8DF\">13</text></g><g class=\"bar\" style=\"animation-delay:520ms\"><rect x=\"328\" y=\"200\" width=\"92\" height=\"82\" rx=\"6\" fill=\"#12301F\" stroke=\"#52B788\" stroke-width=\"2.5\"/><text x=\"374\" y=\"242\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-family=\"JetBrains Mono\" font-size=\"28\" font-weight=\"800\" fill=\"#DCE8DF\">14</text></g><g class=\"bar\" style=\"animation-delay:560ms\"><rect x=\"436\" y=\"200\" width=\"92\" height=\"82\" rx=\"6\" fill=\"#12301F\" stroke=\"#52B788\" stroke-width=\"2.5\"/><text x=\"482\" y=\"242\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-family=\"JetBrains Mono\" font-size=\"28\" font-weight=\"800\" fill=\"#DCE8DF\">15</text></g></svg><div class=\"src\">gold = blockers, the run stops there · brand/claims.md</div>"}}, {"sec": "02 agents", "t": "14:40-15:30", "mins": 0.83, "caption": "Run the skill. Never invent rules.", "notes": "ON SCREEN: the youtube-lead-magnet agent.<br>SAY: Agent four. Packaging drift: every lead magnet came out a little different. Its first instruction is to run the existing skill and never invent rules, and to read the skill files fresh every run.", "left": {"kind": "file", "lines": ["You build YouTube video lead magnets for <span class=\"m-red\">[redacted</span>]. Your job is to run the existing skill, not to invent rules. The skill files are the single source of truth and are updated often <span class=\"m-dim\">...</span>"], "hl": [8], "start": 8}, "tabs": [".claude/agents/youtube-lead-magnet.md"], "tabOn": 0, "on": [15], "needs": [], "status": ".claude/agents/youtube-lead-magnet.md"}, {"sec": "03 proof", "t": "15:30-16:30", "mins": 1.0, "caption": "25 scripts. One per number anyone cites.", "notes": "ON SCREEN: part of the tools folder.<br>SAY: Section three, the part that keeps it honest. 25 Python scripts. The rule behind them: the analysis that produced a number gets saved as a script. An inline calculation is gone at the next context clear, and then someone re-derives it slightly differently and the two numbers disagree in a meeting.", "left": {"kind": "term", "cmds": [{"cmd": "ls ops/tools/", "out": ["<span class=\"m-y\">impressions-vs-calls.py</span>   consolidate-exports.py   post-to-call.py", "trace-bookings.py         call-structure.py        article-title-features.py", "lane-tables.py            backlog-sync.py          build-dashboard.py", "<span class=\"m-dim\">...</span>", "<span class=\"m-dim\"># 25 scripts, as published 2026-09-10</span>"]}]}, "tabs": ["zsh · agency-os"], "tabOn": 0, "on": [19], "needs": [], "status": "ops/tools/"}, {"sec": "03 proof", "t": "16:30-17:40", "mins": 1.17, "caption": "Every script states its <em>own limit</em>", "notes": "ON SCREEN: CONVENTIONS.md, rule 3. A script name is redacted.<br>SAY: Rule three. Every script states its own limit, at the top, in the docstring. One tool was named as if it measured one account's bookings. It measures all inbound. The docstring now says so in capitals.", "left": {"kind": "file", "lines": ["## 3. Every script states its own limit in its docstring", "Not in a comment further down. In the opening docstring, where anyone reading the file sees it first.", "**Why:** `<span class=\"m-red\">[redacted</span>]-article-call-window.py` was named as if it measured one account's bookings. It measures all inbound bookings, because 649 of 678 Calendly rows sit under one owner and UTM is empty on 673. The name asserted something the data could not support. The docstring now says so in capitals."], "hl": [29], "start": 1, "nums": [25, 27, 29]}, "tabs": ["ops/CONVENTIONS.md"], "tabOn": 0, "on": [18], "needs": [], "status": "ops/CONVENTIONS.md"}, {"sec": "03 proof", "t": "17:40-18:40", "mins": 1.0, "caption": "<em>649</em> of 678 rows. One owner.", "notes": "ON SCREEN: the two splits that break channel attribution.<br>SAY: Here's why. 649 of 678 Calendly rows sit under one owner. The UTM field is empty on 673 of them. So you can't attribute a booking to a channel from this export. That's why I gave you the 150 as a total at the start.", "left": {"kind": "chart", "html": "<svg class=\"chart\" width=\"1180\" height=\"280\" viewBox=\"0 0 1180 280\" role=\"img\"><text x=\"0\" y=\"20\" font-family=\"Inter, sans-serif\" font-size=\"22\" font-weight=\"700\" fill=\"#DCE8DF\" text-anchor=\"start\" dominant-baseline=\"middle\" >Calendly rows by owner · 678 total</text><g class=\"bar\" style=\"animation-delay:0ms\"><title>649 under one owner</title><rect x=\"0.0\" y=\"40\" width=\"1129.5\" height=\"54\" rx=\"4\" fill=\"#E9B949\"/><text x=\"18.0\" y=\"67\" font-family=\"Inter, sans-serif\" font-size=\"22\" font-weight=\"800\" fill=\"#0B1A12\" text-anchor=\"start\" dominant-baseline=\"middle\" >649 under one owner</text></g><g class=\"bar\" style=\"animation-delay:80ms\"><title>29 other</title><rect x=\"1131.5\" y=\"40\" width=\"48.5\" height=\"54\" rx=\"4\" fill=\"#5E8C73\"/><text x=\"1180.0\" y=\"116\" font-family=\"Inter, sans-serif\" font-size=\"19\" font-weight=\"700\" fill=\"#DCE8DF\" text-anchor=\"end\" dominant-baseline=\"middle\" >29 other</text></g><text x=\"0\" y=\"160\" font-family=\"Inter, sans-serif\" font-size=\"22\" font-weight=\"700\" fill=\"#DCE8DF\" text-anchor=\"start\" dominant-baseline=\"middle\" >UTM field · 678 rows</text><g class=\"bar\" style=\"animation-delay:160ms\"><title>673 empty</title><rect x=\"0.0\" y=\"180\" width=\"1171.3\" height=\"54\" rx=\"4\" fill=\"#E9B949\"/><text x=\"18.0\" y=\"207\" font-family=\"Inter, sans-serif\" font-size=\"22\" font-weight=\"800\" fill=\"#0B1A12\" text-anchor=\"start\" dominant-baseline=\"middle\" >673 empty</text></g><g class=\"bar\" style=\"animation-delay:240ms\"><title>5 filled</title><rect x=\"1173.3\" y=\"180\" width=\"6.7\" height=\"54\" rx=\"4\" fill=\"#5E8C73\"/><text x=\"1180.0\" y=\"256\" font-family=\"Inter, sans-serif\" font-size=\"19\" font-weight=\"700\" fill=\"#DCE8DF\" text-anchor=\"end\" dominant-baseline=\"middle\" >5 filled</text></g></svg><div class=\"src\">649 of 678 · UTM empty on 673 · brand/claims.md · 29 and 5 are 678 minus the published figures</div>"}, "tabs": ["calendly-rows.svg"], "tabOn": 0, "on": [18], "needs": [], "status": "ops/CONVENTIONS.md"}, {"sec": "03 proof", "t": "18:40-19:50", "mins": 1.17, "caption": "Worked example: the claim that <em>felt true</em>", "notes": "ON SCREEN: rule one, the three evidence tags.<br>SAY: Rule one. Every claim carries one of three tags: measured, observed, assumed. A claim with no tag gets deleted. Here's the case that made the rule.", "left": {"kind": "file", "lines": ["## 1. Every claim carries its evidence status", "Three tags. A claim with no tag is an assertion and gets deleted on sight.", "| `[measured]` | a script and a dataset produced it. Name both | <span class=\"m-dim\">...</span>", "| `[observed]` | seen directly, not quantified | <span class=\"m-dim\">...</span>", "| `[assumed]` | a judgement call, stated as one | <span class=\"m-dim\">...</span>", "**Why:** on 2026-09-01 a skill asserted \"the worked example is the section that converts.\" Measuring it returned 60,000 against 264,000, the opposite direction. The claim had felt obviously true. Tagging forces the check before the claim ships."], "hl": [15], "start": 1, "nums": [5, 7, 11, 12, 13, 15]}, "tabs": ["ops/CONVENTIONS.md"], "tabOn": 0, "on": [18], "needs": [], "status": "ops/CONVENTIONS.md"}, {"sec": "03 proof", "t": "19:50-20:50", "mins": 1.0, "caption": "Before: assumed. After: measured, and <em>reversed</em>.", "notes": "ON SCREEN: the claimed section against the winning section.<br>SAY: Before, the skill said the worked example was the converting section. It felt obviously true. After measuring: 60,000 against the winning section's 264,000. The opposite direction. Tagging forces that check before a claim ships.", "left": {"kind": "chart", "html": "<svg class=\"chart\" width=\"1180\" height=\"208\" viewBox=\"0 0 1180 208\" role=\"img\"><g class=\"bar\" style=\"animation-delay:0ms\"><title>worked example (claimed): 60,000</title><text x=\"362\" y=\"54.0\" font-family=\"JetBrains Mono, sans-serif\" font-size=\"21\" font-weight=\"600\" fill=\"#C4D3C9\" text-anchor=\"end\" dominant-baseline=\"middle\" >worked example (claimed)</text><rect x=\"380\" y=\"14\" width=\"136.4\" height=\"80\" rx=\"4\" fill=\"#5E8C73\"/><text x=\"530.4\" y=\"54.0\" font-family=\"JetBrains Mono, monospace\" font-size=\"23\" font-weight=\"800\" fill=\"#DCE8DF\" dominant-baseline=\"middle\">60,000</text></g><g class=\"bar\" style=\"animation-delay:70ms\"><title>winning section: 264,000</title><text x=\"362\" y=\"154.0\" font-family=\"JetBrains Mono, sans-serif\" font-size=\"21\" font-weight=\"600\" fill=\"#DCE8DF\" text-anchor=\"end\" dominant-baseline=\"middle\" >winning section</text><rect x=\"380\" y=\"114\" width=\"600.0\" height=\"80\" rx=\"4\" fill=\"#E9B949\"/><text x=\"994.0\" y=\"154.0\" font-family=\"JetBrains Mono, monospace\" font-size=\"23\" font-weight=\"800\" fill=\"#E9B949\" dominant-baseline=\"middle\">264,000</text></g><line x1=\"380\" y1=\"0\" x2=\"380\" y2=\"208\" stroke=\"#86A293\" stroke-width=\"2\"/></svg><div class=\"src\">brand/claims.md, 'The content system, as published 2026-09-10'</div>"}, "tabs": ["measured.svg"], "tabOn": 0, "on": [18], "needs": [], "status": "ops/CONVENTIONS.md"}, {"sec": "03 proof", "t": "20:50-21:40", "mins": 0.83, "caption": "185 tasks pushed. <em>Zero</em> ticked.", "notes": "ON SCREEN: the daily task log. O  * self-contained) between the board-corrections start and end HTML comment markers:
 *   growthub-os: python3 boards/inject-corrections.py <board.html> ...
 *   mauro-os:    boards/yt/v2/controls.py puts it in every generated board, before the control bar.
 *
 * Frames: window.YTNAV ({count, index, label}) when the board has a slide adapter (one frame on screen at
 * a time: one "Comment" button for the current frame). Otherwise every [data-frame], else .frame, else
 * <section> gets its own small comment button. Heading = data-frame value, else the first h1-h3/.head.
 *
 * Draft layer: D toggles it. ON = review (elements with class "draft" show, the correction tools show,
 * a DRAFT BOARD badge shows). OFF = recording (all of that is gone). Default ON; headless Chrome and
 * ?static default OFF so renders stay clean; ?draft=on / ?draft=off win where the board keeps its URL
 * (a-keynote rewrites it to ?s=N, so use D there). H hides the tools only.
 * State in localStorage (every access in try/catch), key per board file.
 * Download: board-corrections-<board-slug>-<date>.txt, one line per note: "Frame N · <heading>: <note>".
 * ~/inbox/run.py files those under ~/review-queue/decisions/boards/.
 */
(function () {

  var KEY = 'board-corrections:' + path, DKEY = 'board-draft:' + path, HKEY = 'board-corrections-hidden';

  var saved = get(DKEY);

  var notes = {};
  try { notes = JSON.parse(get(KEY) || '{}') || {}; } catch (e) { notes = {}; }
  function save() { set(KEY, JSON.stringify(notes)); paintCount(); }

  var css = document.createElement('style');
  css.textContent =
    'html.draft-off .draft{display:none!important}' +
    '.bc-ui{font:600 13px/1.3 -apple-system,"Helvetica Neue",Arial,sans-serif;color:#111;box-sizing:border-box}' +
    '.bc-ui *{box-sizing:border-box}' +
    'html.draft-off .bc-ui,html.bc-hide .bc-ui{display:none!important}' +
    '.bc-btn{all:unset;cursor:pointer;background:#F3E3A3;color:#111;border:1.5px solid #111;border-radius:999px;padding:5px 11px;font:700 13px/1 -apple-system,"Helvetica Neue",Arial,sans-serif;white-space:nowrap}' +
    '.bc-btn:hover{background:#ffd84a}.bc-btn.has{background:#111;color:#F3E3A3}' +

    '#bc-panel{position:fixed;right:14px;bottom:14px;z-index:2147483001;background:#fff;border:2px solid #111;border-radius:14px;padding:10px;width:300px;box-shadow:0 8px 28px rgba(0,0,0,.25)}' +

    '#bc-panel .cur b{display:block;margin-bottom:6px}#bc-panel .msg{font-weight:500;color:#555;margin-top:6px;min-height:1em}' +
    '#bc-draft{position:fixed;left:14px;top:14px;z-index:2147483001;background:#bd0a0a;color:#fff;border-radius:8px;padding:8px 12px;font:800 14px/1.2 -apple-system,"Helvetica Neue",Arial,sans-serif;letter-spacing:1px}' +
    '#bc-draft span{display:block;font-weight:500;letter-spacing:0;font-size:12px;opacity:.9}';
  document.head.appendChild(css);

  function clean(s) { return String(s == null ? '' : s).replace(/<[^>]*>/g, '').replace(/&[a-z#0-9]+;/gi, ' ').replace(/\s+/g, ' ').trim(); }

  var frames = [], NAV = null, panel, curBox, curTa, curLab, countEl, msgEl, frameBtn;

  }

  function setNote(n, h, t) {

  function buildDom() {

    if (!sel.length) sel = document.querySelectorAll('section');

    frames.forEach(function (el, i) {
      var n = i + 1, h = heading(el, i);

    ['click', 'mousedown', 'wheel'].forEach(function (ev) { panel.addEventListener(ev, function (e) { e.stopPropagation(); }); });
    if (NAV) {
      curBox = panel.querySelector('.cur'); curTa = curBox.querySelector('textarea'); curLab = curBox.querySelector('b');
      frameBtn = panel.querySelector('[data-a=frame]');
      curTa.addEventListener('input', function () {
        setNote(+curBox.dataset.n, curBox.dataset.h, curTa.value);
        frameBtn.textContent = '✎ Frame ' + curBox.dataset.n + (curTa.value.trim() ? ' ●' : '');
      });
      setInterval(navSync, 200); navSync();
    }
    panel.addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      var a = b.dataset.a;
      if (a === 'frame') { curBox.classList.toggle('on'); if (curBox.classList.contains('on')) curTa.focus(); }
      else if (a === 'copy') {
        var t = text();
        var done = function () { flash('Copied ' + lines().length + ' notes'); };
        try {
          navigator.clipboard.writeText(t).then(done, function () { fallbackCopy(t); done(); });
        } catch (err) { fallbackCopy(t); done(); }
      } else if (a === 'dl') {
        try {
          var blob = new Blob([text()], { type: 'text/plain' });
          var u = URL.createObjectURL(blob), l = document.createElement('a');
          l.href = u; l.download = 'board-corrections-' + slug + '-' + new Date().toISOString().slice(0, 10) + '.txt';
          document.body.appendChild(l); l.click(); l.remove(); setTimeout(function () { URL.revokeObjectURL(u); }, 1000);
          flash('Downloaded');
        } catch (err) { flash('Download failed: ' + err); }
      }
    });
    document.body.appendChild(panel);
    paintCount();
  }
  function fallbackCopy(t) {
    var x = document.createElement('textarea'); x.value = t; x.style.position = 'fixed'; x.style.opacity = '0';
    document.body.appendChild(x); x.select(); try { document.execCommand('copy'); } catch (e) {} x.remove();
  }

  var badge;
  function paint() {
    var r = document.documentElement;   // on <html>: some boards rewrite body.className per slide
    r.classList.toggle('draft-off', !draft);
    r.classList.toggle('draft-on', draft);
    r.classList.toggle('bc-hide', hidden);
  }

  // Keys. Registered now, in the capture phase, so it runs before any board handler injected after it.
  window.addEventListener('keydown', function (e) {
    if (isField(e.target) && e.target.closest && e.target.closest('.bc-ui')) {
      if (e.key === 'Escape') e.target.blur();
      e.stopImmediatePropagation();   // typing in a box never moves the board, hides the bar or toggles a layer
      return;
    }
    if (isField(e.target) || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'd' || e.key === 'D') {
      draft = !draft; set(DKEY, draft ? 'on' : 'off'); paint();
    } else if (e.key === 'h' || e.key === 'H') {
      hidden = !hidden; set(HKEY, hidden ? 'on' : 'off'); paint();
    }
  }, true);

  function init() {
    NAV = window.YTNAV || null;
    if (!NAV) buildDom();
    buildPanel();
    badge = document.createElement('div'); badge.id = 'bc-draft'; badge.className = 'draft';
    badge.innerHTML = 'DRAFT BOARD<span>D = recording view</span>';
    document.body.appendChild(badge);
    paint();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { setTimeout(init, 0); });
  else setTimeout(init, 0);
  paint();
})();
</script>

<script>
(function(){
const NAV={count:()=>F.length,index:()=>i,go:show,next:()=>show(i+1),prev:()=>show(i-1),label:k=>F[k].t+' · '+F[k].caption};
window.YTNAV=NAV;  // board-corrections.js reads the frame count, index and labels from here
const strip=s=>String(s==null?'':s).replace(/<[^>]*>/g,'').replace(/&[a-z#0-9]+;/gi,' ').replace(/\s+/g,' ').trim();
const bar=document.createElement('div');bar.id='ytbar';
bar.innerHTML='<button data-a="prev" title="Previous (Left arrow)">&#9664;</button><span class="ct"></span>'+
 '<button data-a="next" title="Next (Right arrow or Space)">&#9654;</button><button data-a="list" title="Frame list">Frames</button>'+
 '<span class="hk">H hide · N notes · F full</span>';
const list=document.createElement('div');list.id='ytlist';
document.body.appendChild(list);document.body.appendChild(bar);
const ct=bar.querySelector('.ct');
let hidden=/HeadlessChrome/.test(navigator.userAgent)||/[?&]static/.test(location.search);
try{const v=localStorage.getItem('ytbar');if(v!==null&&!hidden)hidden=v==='off';}catch(e){}
function paint(){bar.classList.toggle('off',hidden);if(hidden)list.classList.remove('on');}
function fill(){const n=NAV.count(),c=NAV.index();let h='';
 for(let k=0;k<n;k++){h+='<div data-k="'+k+'"'+(k===c?' class="cur"':'')+'><b>'+(k+1)+'</b> '+strip(NAV.label(k))+'</div>';}
 list.innerHTML=h;}
let last=-1;
function sync(){const c=NAV.index(),n=NAV.count();if(c===last)return;last=c;ct.textContent=(c+1)+' / '+n;
 if(list.classList.contains('on'))fill();}
setInterval(sync,120);
// Keep focus on the document: a click on the bar never focuses a control.
[bar,list].forEach(el=>{el.addEventListener('mousedown',e=>e.preventDefault());
 el.addEventListener('click',e=>{e.stopPropagation();});});
bar.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.a;
 if(a==='prev')NAV.prev();else if(a==='next')NAV.next();
 else if(a==='list'){list.classList.toggle('on');if(list.classList.contains('on')){fill();const cur=list.querySelector('.cur');if(cur)cur.scrollIntoView({block:'center'});}}
 if(document.activeElement&&document.activeElement!==document.body)document.activeElement.blur();sync();});
list.addEventListener('click',e=>{const d=e.target.closest('[data-k]');if(!d)return;NAV.go(+d.dataset.k);list.classList.remove('on');
 if(document.activeElement&&document.activeElement!==document.body)document.activeElement.blur();sync();});
// If anything else took focus (a link, the list), give it back before the format's key handler runs.
addEventListener('keydown',e=>{const a=document.activeElement;
 if(a&&(/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)||a.isContentEditable))return;
 if(a&&a!==document.body&&a!==document.documentElement&&!/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&!a.isContentEditable)a.blur();
 if(e.key==='h'||e.key==='H'){hidden=!hidden;try{localStorage.setItem('ytbar',hidden?'off':'on');}catch(_){}paint();}
 else if(e.key==='Escape'){list.classList.remove('on');}},true);
// #N in the address bar jumps to frame N.
addEventListener('hashchange',()=>{const m=location.hash.match(/\d+/);if(!m)return;const k=parseInt(m[0],10)-1;
 if(k>=0&&k<NAV.count()&&k!==NAV.index())NAV.go(k);});
paint();sync();
})();
</script>
