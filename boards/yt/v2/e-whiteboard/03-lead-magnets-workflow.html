.f{position:absolute;inset:0;visibility:hidden}
.f.cur{visibility:visible}

g.done path.ink,g.done .hl,g.done text,g.done image,g.done .needs{animation:none!important;stroke-dasharray:none;opacity:1;transform:none}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes swipe{to{transform:scaleX(1)}}
@keyframes fade{to{opacity:1}}
#notes{position:fixed;left:0;right:0;bottom:0;max-height:46vh;overflow:auto;background:rgba(20,20,20,.94);color:#F2EEE4;

-width="4.2" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><path class="ink" d="M1175.6 522.0 C1154.6 521.9 1091.2 521.0 1049.3 521.1 C1007.4 521.1 966.2 522.1 924.4 522.2 C882.6 522.3 840.3 521.8 798.7 521.5 C757.1 521.1 716.4 519.9 674.8 520.1 C633.1 520.3 590.3 522.4 548.7 522.5 C507.1 522.6 445.7 521.2 425.2 520.9" fill="none" stroke="#1E1E1E" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><path class="ink" d="M430.2 525.4 C430.5 508.6 431.9 458.1 431.9 424.5 C431.9 390.8 430.6 340.3 430.3 323.4" fill="none" stroke="#1E1E1E" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><text x="800.0" y="445.0" font-size="74" text-anchor="middle" style="font-family:'Caveat',cursive;font-weight:700" fill="#1E1E1E" data-maxw="700">Agency Booked Calls</text></g><g data-s="1"><path class="ink" d="M800.0 560.0 Q759.6 678.3 800.0 800.0" fill="none" stroke="#1E1E1E" stroke-width="6.0" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><path class="ink" d="M782.0 786.1 L800.0 800.0" fill="none" stroke="#1E1E1E" stroke-width="6.0" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><path class="ink" d="M804.6 778.5 L800.0 800.0" fill="none" stroke="#1E1E1E" stroke-width="6.0" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><path class="ink" d="M640.0 834.9 C648.9 835.3 675.6 836.8 693.3 837.1 C711.1 837.3 728.9 837.2 746.7 836.4 C764.4 835.6 782.2 832.8 800.0 832.4 C817.8 831.9 835.6 833.2 853.3 833.6 C871.1 834.0 888.9 834.5 906.7 834.7 C924.4 834.9 951.1 834.9 960.0 835.0" fill="none" stroke="#1E1E1E" stroke-width="5.0" stroke-linecap="round" stroke-linejoin="round" opacity="1"/></g></svg></div></div><div id="notes"></div><script id="nd" type="application/json">[{"t": "0:00-0:12", "h": "On 1 October I timed one run of my LinkedIn lead magnet process. From pasting the post to a live staging page took 24 minutes, and I estimate about five of those minutes were my own attention.<br><br>That only holds because the resource it promised already existed. I will show you both sides."}, {"t": "0:12-0:20", "h": "Free resource in exchange for a comment is the most copied mechanic on X and LinkedIn right now. The version that gets copied is missing the measurement. By the end of this video you have the whole workflow, and the one piece of it that could tell you which post booked a call."}, {"t": "0:20-0:30", "h": "Three parts. First the clock: what the time numbers actually cover. Second the build itself, phase by phase, with one run walked through. Third the keyword, and why it is the only instrument you have."}, {"t": "0:30-0:50", "h": "Part one, the clock. Time claims are where this topic gets oversold, so I start there."}, {"t": "0:50-1:50", "h": "Here is the mechanic. A post offers a free resource, people comment a keyword, they get a DM with the resource. And then nothing. There is no path from the keyword to the calendar.<br><br>That missing arrow is the whole video."}, {"t": "1:50-2:55", "h": "The before and after for this part is how you talk about time. Before: you quote only the short clock. After: you say both. There are two clocks in this workflow, and they measure different things. One is the Claude pass that produces the document. The other is the full cycle: ideation, format choice, the human pass, the cover, the post copy, the DM copy and the handoff.<br><br>[NEEDS sign-off before you say either number. The walkthrough says about fifteen minutes for the Claude pass. The SOP says two to three hours hands-on. Saying only the short one is the overclaim this audience has learned to distrust.]"}, {"t": "2:55-4:00", "h": "The worked example for this part: the one clock I measured. My LinkedIn lead magnet process, 24 minutes from paste to a live staging page. Inside that, about five minutes were my attention: find the post, capture it, read the draft. The five is my estimate, the 24 is the clock.<br><br>And the 24 only holds because we already had the resource built."}, {"t": "4:00-4:50", "h": "The branch where the resource does not exist yet, where you have to build the magnet itself, has no measured time. So I do not call it the slowest step, because nothing has timed it."}, {"t": "4:50-5:55", "h": "The SOP itself flags ideation as the bottleneck, and it says it is worse on paper than in my head.<br><br>The triggers are a new week, a new YouTube video, an insight from a sales call, a trend, a competitor move, or a pattern from Monday tracking."}, {"t": "5:55-6:45", "h": "Ideation outputs exactly two things: one topic and a one-line angle. Cadence is deliberately not fixed. A magnet ships when ideation surfaces one."}, {"t": "6:45-7:05", "h": "Part two, the build. Four phases, and one real run walked through at the end."}, {"t": "7:05-8:05", "h": "Four phases. Ideation and format. Then production, where Claude does its pass. Then packaging and distribution. Then Monday, where last week&#x27;s winners get reviewed and the next ones get iterated."}, {"t": "8:05-9:00", "h": "The format pick. A Notion doc with subpages, the five-pager, is the most common. Then a Gamma deck, an existing YouTube video used as the magnet, or Canva slides. The topic picks the format."}, {"t": "9:00-10:05", "h": "Production. The context goes to Claude: topic, angle and format, plus the topic-specific inputs. The source transcript, the SOP, examples, brand context, the audience and the proof points.<br><br>The SOP flags one fix here: the skill should ask for these inputs instead of waiting to be fed them."}, {"t": "10:05-11:05", "h": "The magnet itself has a subtype: prompt swipe file, framework, case study, YouTube video and industry-specific. The subtype comes from what the topic actually is.<br><br>The before and after for this part. Before: a framework forced into a swipe file reads as padding. A case study forced into a framework loses the one thing that made it credible, the specific account it happened in. After: the topic picks the subtype."}, {"t": "11:05-12:00", "h": "Packaging. A cover image. The X post copy and its DM message. The LinkedIn post copy and its LeadShark DM message. And optionally, follow-up images posted after it, each with a one-liner."}, {"t": "12:00-13:15", "h": "Here is the run I timed on 1 October. I found a proven LinkedIn post, captured it, Claude drafted the package, I read the draft, and the staging page went live. 24 minutes end to end.<br><br>My part was finding the post, capturing it and reading the draft. Everything between those was the system."}, {"t": "13:15-14:10", "h": "Where the post comes from matters. The proven LinkedIn posts this process starts from mostly carry 300 or more comments. The reference is already proven before Claude touches it."}, {"t": "14:10-14:55", "h": "Distribution goes to the VA, who schedules it. In the SOP the VA is an owner, so that step is not optional."}, {"t": "14:55-15:15", "h": "Part three, the keyword, and why it is the only instrument on the dashboard."}, {"t": "15:15-16:20", "h": "Here is the booking data. 678 Calendly rows. 649 of them sit under one owner, and the UTM field is empty on 673 of them.<br><br>So you cannot attribute a booking to a post from the calendar. The data is not there."}, {"t": "16:20-17:25", "h": "That is why the keyword matters. A unique DM word per asset is the only path from a piece of content to a booked call that could be attributed.<br><br>To be straight with you: nothing in my setup joins a keyword to a booking yet. This is the design. The join is the piece that is still missing, so this part has no real worked example yet."}, {"t": "17:25-18:25", "h": "What runs instead is a same-day read. A booking on day D gets credited to the posts from day D and the day before.<br><br>The script that does it calls this correlation. It never calls it attribution, and I say it the same way."}, {"t": "18:25-19:25", "h": "The rule that stops this from embarrassing you. A keyword is a promise. Never publish a post that carries a keyword, or a comment-to-DM call to action, unless the resource and the thing that delivers it are already built.<br><br>Before: the post goes out and the asset is still a plan. After: the asset exists, then the post."}, {"t": "19:25-20:25", "h": "Monday closes the loop. I review last week&#x27;s winners, iterate on them, and exploit what worked. Then the next magnet starts from what the review found."}, {"t": "20:25-21:05", "h": "If you run an established agency and want this workflow installed, with the measurement built in, the offer is called Agency Booked Calls. The link is in the description."}]</script><script>
const frames=[...document.querySelectorAll('.f')];
const NOTES=JSON.parse(document.getElementById('nd').textContent);
const P=new URLSearchParams(location.search);
const STATIC=P.has('static');
let nofx=false;
let fi=Math.max(0,Math.min(frames.length-1,(parseInt(P.get('f'))||1)-1)), st=0;
function maxs(f){return Math.max(0,...[...f.querySelectorAll('g[data-s]')].map(g=>+g.dataset.s))}
function prep(){
 frames.forEach(f=>f.querySelectorAll('g[data-s]').forEach(g=>{
  g.querySelectorAll('path.ink').forEach((p,i)=>{const L=Math.ceil(p.getTotalLength())+2;
   p.style.setProperty('--L',L);p.style.setProperty('--d',Math.min(1.1,.25+L/1400)+'s');
   p.style.setProperty('--dl',Math.min(1.4,i*.05)+'s');});
 }));
 document.querySelectorAll('text[data-maxw]').forEach(t=>{const m=+t.dataset.maxw,L=t.getComputedTextLength();
  if(L>m){t.setAttribute('font-size',(parseFloat(t.getAttribute('font-size'))*m/L).toFixed(1))}});
 document.querySelectorAll('text[data-hl]').forEach(t=>{const [a,n]=t.dataset.hl.split(',').map(Number);
  const x0=t.getStartPositionOfChar(a).x, w=t.getSubStringLength(a,n), bb=t.getBBox();
  const r=document.createElementNS('http://www.w3.org/2000/svg','polygon');
  const y=bb.y+bb.height*.42,h=bb.height*.5;
  r.setAttribute('points',`${x0-10},${y+3} ${x0+w+12},${y-2} ${x0+w+8},${y+h} ${x0-6},${y+h+3}`);
  r.setAttribute('fill','#F3E3A3');r.setAttribute('class','hl');t.parentNode.insertBefore(r,t);});
}
function show(){
 frames.forEach((f,i)=>f.classList.toggle('cur',i===fi));
 const f=frames[fi];
 f.querySelectorAll('g[data-s]').forEach(g=>{const s=+g.dataset.s;
  g.classList.toggle('on',s<=st);
  if(STATIC||nofx||s<st){g.classList.add('done')} else if(s===st){g.classList.remove('done')}
  if(s>st)g.classList.remove('done');});
 const n=NOTES[fi];document.getElementById('notes').innerHTML='<b>FRAME '+(fi+1)+' / '+frames.length+' · '+n.t+'</b>'+n.h;
}
function next(){nofx=false;if(st<maxs(frames[fi])){st++;show()}else if(fi<frames.length-1){fi++;st=0;show()}}
function prev(){if(st>0){st--;nofx=true;show()}else if(fi>0){fi--;st=maxs(frames[fi]);nofx=true;show()}}
addEventListener('keydown',e=>{
 if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();next()}
 else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prev()}
 else if(e.key==='n'||e.key==='N'){document.getElementById('notes').classList.toggle('show')}
 else if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}
});
document.getElementById('stage').addEventListener('click',next);
(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>{prep();if(STATIC)st=maxs(frames[fi]);show()});
</script><!-- board-corrections:start -->
<script>
/* board-corrections.js · per-frame correction boxes + draft layer for every HTML board.
 * Mauro 2026-10-09: "every board needs a correction box per frame, with Copy and Download, like the review queue".
 * One file, copied byte for byte to growthub-os/boards/ and mauro-os/boards/. Injected INLINE (boards stay
 * self-contained) between the board-corrections start and end HTML comment markers:
 *   growthub-os: python3 boards/inject-corrections.py <board.html> ...
 *   mauro-os:    boards/yt/v2/controls.py puts it in every generated board, before the control bar.
 *
 * Frames: window.YTNAV ({count, index, label}) when the board has a slide adapter (one frame on screen at
 * a time: one "Comment" button for the current frame). Otherwise every [data-frame], else .frame, else
 * <section> gets its own small comment button. Heading = data-frame value, else the first h1-h3/.head.
 *
 * Draft layer: D toggles it. ON = review (elements with class "draft" show, the correction tools show,
 * a DRAFT BOARD badge shows). OFF = recording (all of that is gone). Default ON; headless Chrome and
 * ?static default OFF so renders stay clean; ?draft=on / ?draft=off always win. H hides the tools only.
 * State in localStorage (every access in try/catch), key per board file.
 * Download: board-corrections-<board-slug>-<date>.txt, one line per note: "Frame N · <heading>: <note>".
 * ~/inbox/run.py files those under ~/review-queue/decisions/boards/.
 */
(function () {
  if (window.__boardCorrections) return;
  window.__boardCorrections = true;
  var Q = new URLSearchParams(location.search);
  var headless = /HeadlessChrome/.test(navigator.userAgent);
  var path = decodeURIComponent(location.pathname);
  var parts = path.split('/').filter(Boolean);
  var slug = (parts.pop() || 'board').replace(/\.html?$/i, '');
  if (/^(board|index)$/i.test(slug) && parts.length) slug = parts[parts.length - 1];
  slug = slug.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'board';
  var KEY = 'board-corrections:' + path, DKEY = 'board-draft:' + path, HKEY = 'board-corrections-hidden';
  function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  var forced = Q.get('draft');
  var draft = true;
  var saved = get(DKEY);
  if (saved !== null) draft = saved === 'on';
  if (headless || Q.has('static')) draft = false;
  if (forced === 'on' || forced === '1') draft = true;
  if (forced === 'off' || forced === '0') draft = false;
  var hidden = get(HKEY) === 'on';

  var notes = {};
  try { notes = JSON.parse(get(KEY) || '{}') || {}; } catch (e) { notes = {}; }
  function save() { set(KEY, JSON.stringify(notes)); paintCount(); }

  var css = document.createElement('style');
  css.textContent =
    'html.draft-off .draft{display:none!important}' +
    '.bc-ui{font:600 13px/1.3 -apple-system,"Helvetica Neue",Arial,sans-serif;color:#111;box-sizing:border-box}' +
    '.bc-ui *{box-sizing:border-box}' +
    'html.draft-off .bc-ui,html.bc-hide .bc-ui{display:none!important}' +
    '.bc-btn{all:unset;cursor:pointer;background:#F3E3A3;color:#111;border:1.5px solid #111;border-radius:999px;padding:5px 11px;font:700 13px/1 -apple-system,"Helvetica Neue",Arial,sans-serif;white-space:nowrap}' +
    '.bc-btn:hover{background:#ffd84a}.bc-btn.has{background:#111;color:#F3E3A3}' +
    '.bc-pin{position:absolute;top:10px;right:10px;z-index:50}' +
    '.bc-box{display:none;margin:12px 0;background:#fffbe6;border:2px solid #111;border-radius:10px;padding:10px;position:relative;z-index:50}' +
    '.bc-box.on{display:block}.bc-box b{display:block;margin-bottom:6px;font-size:13px}' +
    '.bc-box textarea,#bc-panel textarea{width:100%;min-height:90px;font:500 15px/1.4 -apple-system,"Helvetica Neue",Arial,sans-serif;border:1px solid #999;border-radius:6px;padding:8px;resize:vertical;background:#fff;color:#111}' +
    '#bc-panel{position:fixed;right:14px;bottom:14px;z-index:2147483001;background:#fff;border:2px solid #111;border-radius:14px;padding:10px;width:300px;box-shadow:0 8px 28px rgba(0,0,0,.25)}' +
    '#bc-panel .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}' +
    '#bc-panel .ttl{font-weight:800;margin-right:auto}#bc-panel .cur{margin-top:8px;display:none}#bc-panel .cur.on{display:block}' +
    '#bc-panel .cur b{display:block;margin-bottom:6px}#bc-panel .msg{font-weight:500;color:#555;margin-top:6px;min-height:1em}' +
    '#bc-draft{position:fixed;left:14px;top:14px;z-index:2147483001;background:#bd0a0a;color:#fff;border-radius:8px;padding:8px 12px;font:800 14px/1.2 -apple-system,"Helvetica Neue",Arial,sans-serif;letter-spacing:1px}' +
    '#bc-draft span{display:block;font-weight:500;letter-spacing:0;font-size:12px;opacity:.9}';
  document.head.appendChild(css);

  function clean(s) { return String(s == null ? '' : s).replace(/<[^>]*>/g, '').replace(/&[a-z#0-9]+;/gi, ' ').replace(/\s+/g, ' ').trim(); }
  function oneLine(s) { return String(s).replace(/\s*\n\s*/g, ' / ').trim(); }
  function isField(el) { return el && (/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName) || el.isContentEditable); }
  function keepFocus(el) { el.addEventListener('mousedown', function (e) { if (!isField(e.target)) e.preventDefault(); }); }

  var frames = [], NAV = null, panel, curBox, curTa, curLab, countEl, msgEl, frameBtn;

  function heading(el, i) {
    var v = el.getAttribute('data-frame');
    if (v && !/^\d*$/.test(v.trim())) return clean(v).slice(0, 90);
    var h = el.querySelector('h1,h2,h3,.head,.title,.t2');
    var t = clean(h ? h.textContent : el.textContent);
    return (t || 'Frame ' + (i + 1)).slice(0, 90);
  }

  function lines() {
    var ks = Object.keys(notes).filter(function (k) { return notes[k] && notes[k].t && notes[k].t.trim(); })
      .sort(function (a, b) { return a - b; });
    return ks.map(function (k) { return 'Frame ' + k + ' · ' + String(notes[k].h).replace(/:\s+/g, ', ') + ': ' + oneLine(notes[k].t); });  /* the first ": " ends the heading */
  }
  function text() {
    var d = new Date().toISOString().slice(0, 10);

  }
  function paintCount() { if (countEl) countEl.textContent = 'Corrections (' + lines().length + ')'; }
  function flash(s) { if (msgEl) { msgEl.textContent = s; setTimeout(function () { msgEl.textContent = ''; }, 2500); } }

  function setNote(n, h, t) {
    if (t && t.trim()) notes[n] = { h: h, t: t }; else delete notes[n];
    save();
  }

  function buildDom() {
    var sel = document.querySelectorAll('[data-frame]');
    if (!sel.length) sel = document.querySelectorAll('.frame');
    if (!sel.length) sel = document.querySelectorAll('section');
    for (var i = 0; i < sel.length; i++) frames.push(sel[i]);
    frames.forEach(function (el, i) {
      var n = i + 1, h = heading(el, i);

      var box = document.createElement('div'); box.className = 'bc-box bc-ui';
      box.innerHTML = '<b></b><textarea placeholder="What to change in this frame"></textarea>';
      box.querySelector('b').textContent = 'Frame ' + n + ' · ' + h;
      var ta = box.querySelector('textarea');
      ta.value = notes[n] ? notes[n].t : '';
      function paintBtn() { b.textContent = ta.value.trim() ? '✎ ' + n + ' ●' : '✎ ' + n; b.classList.toggle('has', !!ta.value.trim()); }
      paintBtn();
      keepFocus(b);
      b.addEventListener('click', function (e) { e.stopPropagation(); box.classList.toggle('on'); if (box.classList.contains('on')) ta.focus(); });
      ta.addEventListener('input', function () { setNote(n, h, ta.value); paintBtn(); });
      ['click', 'mousedown', 'wheel'].forEach(function (ev) { box.addEventListener(ev, function (e) { e.stopPropagation(); }); });
      el.appendChild(b); el.appendChild(box);
    });
  }

  function navSync() {
    if (!NAV || !curBox) return;
    var i = NAV.index(), n = i + 1;
    if (curBox.dataset.n === String(n)) return;
    curBox.dataset.n = String(n);
    var h = clean(NAV.label(i)).slice(0, 90) || 'Frame ' + n;
    curBox.dataset.h = h;
    curLab.textContent = 'Frame ' + n + ' · ' + h;
    curTa.value = notes[n] ? notes[n].t : '';
    frameBtn.textContent = '✎ Frame ' + n + (curTa.value.trim() ? ' ●' : '');
  }

  function buildPanel() {
    panel = document.createElement('div'); panel.id = 'bc-panel'; panel.className = 'bc-ui';
    panel.innerHTML = '<div class="row"><span class="ttl"></span>' +
      (NAV ? '<button class="bc-btn" data-a="frame" type="button"></button>' : '') +
      '<button class="bc-btn" data-a="copy" type="button">Copy corrections</button>' +
      '<button class="bc-btn" data-a="dl" type="button">Download corrections</button></div>' +
      (NAV ? '<div class="cur"><b></b><textarea placeholder="What to change in this frame"></textarea></div>' : '') +
      '<div class="msg">D draft layer · H hide tools</div>';
    countEl = panel.querySelector('.ttl'); msgEl = panel.querySelector('.msg');
    keepFocus(panel);
    ['click', 'mousedown', 'wheel'].forEach(function (ev) { panel.addEventListener(ev, function (e) { e.stopPropagation(); }); });
    if (NAV) {
      curBox = panel.querySelector('.cur'); curTa = curBox.querySelector('textarea'); curLab = curBox.querySelector('b');
      frameBtn = panel.querySelector('[data-a=frame]');
      curTa.addEventListener('input', function () {
        setNote(+curBox.dataset.n, curBox.dataset.h, curTa.value);
        frameBtn.textContent = '✎ Frame ' + curBox.dataset.n + (curTa.value.trim() ? ' ●' : '');
      });
      setInterval(navSync, 200); navSync();
    }
    panel.addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      var a = b.dataset.a;
      if (a === 'frame') { curBox.classList.toggle('on'); if (curBox.classList.contains('on')) curTa.focus(); }
      else if (a === 'copy') {
        var t = text();
        var done = function () { flash('Copied ' + lines().length + ' notes'); };
        try {
          navigator.clipboard.writeText(t).then(done, function () { fallbackCopy(t); done(); });
        } catch (err) { fallbackCopy(t); done(); }
      } else if (a === 'dl') {
        try {
          var blob = new Blob([text()], { type: 'text/plain' });
          var u = URL.createObjectURL(blob), l = document.createElement('a');
          l.href = u; l.download = 'board-corrections-' + slug + '-' + new Date().toISOString().slice(0, 10) + '.txt';
          document.body.appendChild(l); l.click(); l.remove(); setTimeout(function () { URL.revokeObjectURL(u); }, 1000);
          flash('Downloaded');
        } catch (err) { flash('Download failed: ' + err); }
      }
    });
    document.body.appendChild(panel);
    paintCount();
  }
  function fallbackCopy(t) {
    var x = document.createElement('textarea'); x.value = t; x.style.position = 'fixed'; x.style.opacity = '0';
    document.body.appendChild(x); x.select(); try { document.execCommand('copy'); } catch (e) {} x.remove();
  }

  var badge;
  function paint() {
    var r = document.documentElement;   // on <html>: some boards rewrite body.className per slide
    r.classList.toggle('draft-off', !draft);
    r.classList.toggle('draft-on', draft);
    r.classList.toggle('bc-hide', hidden);
  }

  // Keys. Registered now, in the capture phase, so it runs before any board handler injected after it.
  window.addEventListener('keydown', function (e) {
    if (isField(e.target) && e.target.closest && e.target.closest('.bc-ui')) {
      if (e.key === 'Escape') e.target.blur();
      e.stopImmediatePropagation();   // typing in a box never moves the board, hides the bar or toggles a layer
      return;
    }
    if (isField(e.target) || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'd' || e.key === 'D') {
      draft = !draft; set(DKEY, draft ? 'on' : 'off'); paint();
    } else if (e.key === 'h' || e.key === 'H') {
      hidden = !hidden; set(HKEY, hidden ? 'on' : 'off'); paint();
    }
  }, true);

  function init() {
    NAV = window.YTNAV || null;
    if (!NAV) buildDom();
    buildPanel();
    badge = document.createElement('div'); badge.id = 'bc-draft'; badge.className = 'draft';
    badge.innerHTML = 'DRAFT BOARD<span>D = recording view</span>';
    document.body.appendChild(badge);
    paint();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { setTimeout(init, 0); });
  else setTimeout(init, 0);
  paint();
})();
</script>

<script>
(function(){
const NAV={count:()=>frames.length,index:()=>fi,go:n=>{fi=Math.max(0,Math.min(frames.length-1,n));st=0;nofx=false;show();},next:next,prev:prev,label:k=>NOTES[k].t+' · '+frames[k].textContent.slice(0,90)};
window.YTNAV=NAV;  // board-corrections.js reads the frame count, index and labels from here
const strip=s=>String(s==null?'':s).replace(/<[^>]*>/g,'').replace(/&[a-z#0-9]+;/gi,' ').replace(/\s+/g,' ').trim();
const bar=document.createElement('div');bar.id='ytbar';
bar.innerHTML='<button data-a="prev" title="Previous (Left arrow)">&#9664;</button><span class="ct"></span>'+
 '<button data-a="next" title="Next (Right arrow or Space)">&#9654;</button><button data-a="list" title="Frame list">Frames</button>'+
 '<span class="hk">H hide · N notes · F full</span>';
const list=document.createElement('div');list.id='ytlist';
document.body.appendChild(list);document.body.appendChild(bar);
const ct=bar.querySelector('.ct');
let hidden=/HeadlessChrome/.test(navigator.userAgent)||/[?&]static/.test(location.search);
try{const v=localStorage.getItem('ytbar');if(v!==null&&!hidden)hidden=v==='off';}catch(e){}
function paint(){bar.classList.toggle('off',hidden);if(hidden)list.classList.remove('on');}
function fill(){const n=NAV.count(),c=NAV.index();let h='';
 for(let k=0;k<n;k++){h+='<div data-k="'+k+'"'+(k===c?' class="cur"':'')+'><b>'+(k+1)+'</b> '+strip(NAV.label(k))+'</div>';}
 list.innerHTML=h;}
let last=-1;
function sync(){const c=NAV.index(),n=NAV.count();if(c===last)return;last=c;ct.textContent=(c+1)+' / '+n;
 if(list.classList.contains('on'))fill();}
setInterval(sync,120);
// Keep focus on the document: a click on the bar never focuses a control.
[bar,list].forEach(el=>{el.addEventListener('mousedown',e=>e.preventDefault());
 el.addEventListener('click',e=>{e.stopPropagation();});});
bar.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.a;
 if(a==='prev')NAV.prev();else if(a==='next')NAV.next();
 else if(a==='list'){list.classList.toggle('on');if(list.classList.contains('on')){fill();const cur=list.querySelector('.cur');if(cur)cur.scrollIntoView({block:'center'});}}
 if(document.activeElement&&document.activeElement!==document.body)document.activeElement.blur();sync();});
list.addEventListener('click',e=>{const d=e.target.closest('[data-k]');if(!d)return;NAV.go(+d.dataset.k);list.classList.remove('on');
 if(document.activeElement&&document.activeElement!==document.body)document.activeElement.blur();sync();});
// If anything else took focus (a link, the list), give it back before the format's key handler runs.
addEventListener('keydown',e=>{const a=document.activeElement;
 if(a&&(/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)||a.isContentEditable))return;
 if(a&&a!==document.body&&a!==document.documentElement&&!/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&!a.isContentEditable)a.blur();
 if(e.key==='h'||e.key==='H'){hidden=!hidden;try{localStorage.setItem('ytbar',hidden?'off':'on');}catch(_){}paint();}
 else if(e.key==='Escape'){list.classList.remove('on');}},true);
// #N in the address bar jumps to frame N.
addEventListener('hashchange',()=>{const m=location.hash.match(/\d+/);if(!m)return;const k=parseInt(m[0],10)-1;
 if(k>=0&&k<NAV.count()&&k!==NAV.index())NAV.go(k);});
paint();sync();
})();
</script>
