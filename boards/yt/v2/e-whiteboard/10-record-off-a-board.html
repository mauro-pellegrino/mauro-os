="ink" d="M640.0 834.9 C648.9 835.3 675.6 836.8 693.3 837.1 C711.1 837.3 728.9 837.2 746.7 836.4 C764.4 835.6 782.2 832.8 800.0 832.4 C817.8 831.9 835.6 833.2 853.3 833.6 C871.1 834.0 888.9 834.5 906.7 834.7 C924.4 834.9 951.1 834.9 960.0 835.0" fill="none" stroke="#1E1E1E" stroke-width="5.0" stroke-linecap="round" stroke-linejoin="round" opacity="1"/></g></svg></div></div><div id="notes"></div><script id="nd" type="application/json">[{"t": "0:00-0:12", "h": "A recording board used to take me four hours to build by hand. It is close to two hours now, and I build four of them every week.<br><br>Everything you see in this video is one of those boards. I am talking off it right now."}, {"t": "0:12-0:20", "h": "A script makes you read, and a board makes you talk. By the end of this video you can turn any script into a board you record from, without a teleprompter and without memorising anything."}, {"t": "0:20-0:30", "h": "Today we go over three things. First, what a board actually is and what makes it record-ready. Second, how I build one straight from the script. Third, what breaks when a board gets big, and what that forced me to change."}, {"t": "0:30-0:55", "h": "Section one. What a board is, and the one standard every board has to meet before I hit record."}, {"t": "0:55-1:55", "h": "Here is the before. I read one line from a script, straight, the way I used to record. [Read one scripted line to camera here.]<br><br>You can hear it. The eyes move, the rhythm goes flat, and it sounds read. Now the same line, off the board on the next frame."}, {"t": "1:55-2:50", "h": "And the after. A board is a single vertical column that maps the video&#x27;s flow, top to bottom. Every concept gets its own container, and there are no raw walls of text.<br><br>[Say the same line again, off the board.]<br><br>Each box holds one beat, one point from the script. You look at the box, you remember the point, and you say it in your own words."}, {"t": "2:50-3:40", "h": "The standard is record-ready. Nothing is missing, and nothing needs editing at the moment I record.<br><br>If I have to stop and fix a box while the camera is on, the board was not finished. That one rule decides whether a board counts as done."}, {"t": "3:40-4:50", "h": "Every beat gets a section type. Title card, section title, question hooks, a narration block, a two-path comparison, a tree, a pillar layout, a multi-column section, a sticky-note grid, label to description rows, an emphasis label and a brand badge.<br><br>The palette is fixed too. Yellow for labels and pillars, light yellow for narration, lilac for section titles, green for a win, red for the negative path, and a dark three-pixel border on every filled box. That border is what gives the stacked-card look."}, {"t": "4:50-5:45", "h": "How do you cut a script into beats? I split at every new topic, at every named process, and at every clear shift in what the script is doing: explaining, demonstrating, listing, concluding.<br><br>I never split mid-thought. One thought stays in one box."}, {"t": "5:45-6:30", "h": "The escape hatch. When I am not sure which container fits, I use plain centred text. Forcing content into a container that does not fit is worse than no container at all."}, {"t": "6:30-7:30", "h": "The worked example is the board you are looking at. The script for this video went in, and it came out as a hook, three sections and a call to action.<br><br>Each section holds one worked example and one before and after. That is the whole shape, and it is the same shape every time."}, {"t": "7:30-7:50", "h": "Section two. How the board gets built straight from the script. The board is built from the script, so you still write one. You just stop reading it."}, {"t": "7:50-8:50", "h": "The build is four steps: beats, then components, then geometry, then the write. Only the last step, the write, touches the board.<br><br>Everything before that happens in a file, where a mistake costs nothing."}, {"t": "8:50-9:40", "h": "Step one, the beats. The script gets split into distinct points, with no summarising and no merging. Then I check the beat count against the runtime I am aiming for, before anything else gets built."}, {"t": "9:40-10:35", "h": "Step three, the geometry. Every coordinate, every height and every gap is computed up front. There is a centre axis, a running vertical stack and a width for each section type.<br><br>Nothing gets nudged by hand afterwards."}, {"t": "10:35-11:40", "h": "The worked example for this part comes from the geometry step. A sticky note takes a width or a height, never both, and it grows to fit its text.<br><br>What happened: I computed a fixed row pitch in advance, a sticky grew, and every row under it drifted into the next one. The fix: shapes take an explicit width and height, so the stack I computed is the stack that lands."}, {"t": "11:40-12:35", "h": "The build reads eight files, in the same order every time: master, visual, archetype, writing, gotchas, assets, diagram, QA.<br><br>The order is the dependency. You cannot pick a visual before you know the archetype, and you cannot run QA on something that is not built."}, {"t": "12:35-13:30", "h": "Diagrams are never placed by hand on the canvas, and never prompted out of an image model. They are written in markup, rendered by headless Chrome, and pasted in as an image. That has been the default since 25 August."}, {"t": "13:30-14:30", "h": "So the before and after for the whole build. Before, something placed wrong stayed wrong, or I lassoed it by hand in the Miro UI and dragged it around.<br><br>After, the beats, the components and the geometry all live in a file, and the board gets one write. That is how four hours by hand came down to close to two."}, {"t": "14:30-14:50", "h": "Section three, and the worked example is a real failure. What breaks when a board gets big, from the repo that has been building boards through the Miro API the longest."}, {"t": "14:50-15:45", "h": "A real recording board runs 200 to 400 items. Every box, every arrow and every label is an item.<br><br>Keep that range in your head, because of the line on the next frame."}, {"t": "15:45-16:40", "h": "Past 200 items, the edit call parses the whole board and gives up. Creating still works. Editing and deleting do not. That was confirmed on 4 August.<br><br>So on any board of real size you get one shot. Every coordinate has to be right before you send it."}, {"t": "16:40-17:40", "h": "On 3 August a 37-item create came back with 17 created and one error covering the other 20. The error named no item and no attribute.<br><br>Two attribute values caused it, and neither was documented as invalid."}, {"t": "17:40-18:25", "h": "And the response made it worse. The response body showed plausible URLs for items that had not been created. It looked like success until you went to the board."}, {"t": "18:25-19:15", "h": "The before and after for this part. Before the limit, a wrong box got fixed by hand. After it, the work moved into a file, a check and one write.<br><br>This is my own read of it. Any system with no undo forces you to be correct up front, and being correct up front turns out to be faster than fixing.<br><br>The limit made placing boxes by hand impossible, and that forced a different shape of work."}, {"t": "19:15-20:15", "h": "Before a board counts, it goes through a gate of fifteen checks. The first four are blockers, and if one of those fails, the run stops right there.<br><br>Roughly half the checks run as a script. The rest need eyes."}, {"t": "20:15-21:15", "h": "Charlie Morgan uses the same format. His framework videos are this exact format: a hand-drawn whiteboard or a live Miro board, narrated with a facecam in the corner. A winding road from a now state to a future state, a funnel, a named theory.<br><br>Some of his most-viewed videos are this format, board plus facecam."}, {"t": "21:15-21:55", "h": "If you run an established agency and you want this kind of content system installed for you, the offer is called Agency Booked Calls. The link is in the description."}]</script><script>
const frames=[...document.querySelectorAll('.f')];
const NOTES=JSON.parse(document.getElementById('nd').textContent);
const P=new URLSearchParams(location.search);
const STATIC=P.has('static');
let nofx=false;
let fi=Math.max(0,Math.min(frames.length-1,(parseInt(P.get('f'))||1)-1)), st=0;
function maxs(f){return Math.max(0,...[...f.querySelectorAll('g[data-s]')].map(g=>+g.dataset.s))}
function prep(){
 frames.forEach(f=>f.querySelectorAll('g[data-s]').forEach(g=>{
  g.querySelectorAll('path.ink').forEach((p,i)=>{const L=Math.ceil(p.getTotalLength())+2;
   p.style.setProperty('--L',L);p.style.setProperty('--d',Math.min(1.1,.25+L/1400)+'s');
   p.style.setProperty('--dl',Math.min(1.4,i*.05)+'s');});
 }));
 document.querySelectorAll('text[data-maxw]').forEach(t=>{const m=+t.dataset.maxw,L=t.getComputedTextLength();
  if(L>m){t.setAttribute('font-size',(parseFloat(t.getAttribute('font-size'))*m/L).toFixed(1))}});
 document.querySelectorAll('text[data-hl]').forEach(t=>{const [a,n]=t.dataset.hl.split(',').map(Number);
  const x0=t.getStartPositionOfChar(a).x, w=t.getSubStringLength(a,n), bb=t.getBBox();
  const r=document.createElementNS('http://www.w3.org/2000/svg','polygon');
  const y=bb.y+bb.height*.42,h=bb.height*.5;
  r.setAttribute('points',`${x0-10},${y+3} ${x0+w+12},${y-2} ${x0+w+8},${y+h} ${x0-6},${y+h+3}`);
  r.setAttribute('fill','#F3E3A3');r.setAttribute('class','hl');t.parentNode.insertBefore(r,t);});
}
function show(){
 frames.forEach((f,i)=>f.classList.toggle('cur',i===fi));
 const f=frames[fi];
 f.querySelectorAll('g[data-s]').forEach(g=>{const s=+g.dataset.s;
  g.classList.toggle('on',s<=st);
  if(STATIC||nofx||s<st){g.classList.add('done')} else if(s===st){g.classList.remove('done')}
  if(s>st)g.classList.remove('done');});
 const n=NOTES[fi];document.getElementById('notes').innerHTML='<b>FRAME '+(fi+1)+' / '+frames.length+' · '+n.t+'</b>'+n.h;
}
function next(){nofx=false;if(st<maxs(frames[fi])){st++;show()}else if(fi<frames.length-1){fi++;st=0;show()}}
function prev(){if(fi>0){fi--;st=maxs(frames[fi]);nofx=true;show()}}
addEventListener('keydown',e=>{
 if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();next()}
 else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prev()}
 else if(e.key==='n'||e.key==='N'){document.getElementById('notes').classList.toggle('show')}
 else if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}
});
document.getElementById('stage').addEventListener('click',next);
(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>{prep();if(STATIC)st=maxs(frames[fi]);show()});
</script></body></html>
