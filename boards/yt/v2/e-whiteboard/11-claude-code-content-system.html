.3 323.4" fill="none" stroke="#1E1E1E" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><text x="800.0" y="445.0" font-size="74" text-anchor="middle" style="font-family:'Caveat',cursive;font-weight:700" fill="#1E1E1E" data-maxw="700">Agency Booked Calls</text></g><g data-s="1"><path class="ink" d="M800.0 560.0 Q759.6 678.3 800.0 800.0" fill="none" stroke="#1E1E1E" stroke-width="6.0" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><path class="ink" d="M782.0 786.1 L800.0 800.0" fill="none" stroke="#1E1E1E" stroke-width="6.0" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><path class="ink" d="M804.6 778.5 L800.0 800.0" fill="none" stroke="#1E1E1E" stroke-width="6.0" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><path class="ink" d="M640.0 834.9 C648.9 835.3 675.6 836.8 693.3 837.1 C711.1 837.3 728.9 837.2 746.7 836.4 C764.4 835.6 782.2 832.8 800.0 832.4 C817.8 831.9 835.6 833.2 853.3 833.6 C871.1 834.0 888.9 834.5 906.7 834.7 C924.4 834.9 951.1 834.9 960.0 835.0" fill="none" stroke="#1E1E1E" stroke-width="5.0" stroke-linecap="round" stroke-linejoin="round" opacity="1"/></g></svg></div></div><div id="notes"></div><script id="nd" type="application/json">[{"t": "0:00-0:12", "h": "This is the content system behind more than 150 qualified booked calls for the agency I run this year. That number is the total from the Calendly export, every channel together, and later in this video I show you why I cannot split it cleanly by channel.<br><br>Today you see the whole thing, the actual repo."}, {"t": "0:12-0:20", "h": "You have heard people say they built a system in Claude Code, and you have never seen the repo. I am going to open mine, folder by folder, and show you the parts that took the longest to get right. By the end you will know how to lay out your own so it does not rot."}, {"t": "0:20-0:30", "h": "Three parts today. First the skeleton: the folders, the map, and the two worked examples I open every week. Second the four agents, and the incident behind each one. Third what keeps the numbers honest, including the claim that measured backwards."}, {"t": "0:30-0:50", "h": "Part one, the skeleton. One repo, and an index that every agent reads first."}, {"t": "0:50-2:00", "h": "Here is the repo. One repo, eleven top-level areas, all indexed in one file called MAP.md.<br><br>Skills, the agents, ops with the conventions and the tools, research, the accounts, the weekly acquisition analysis, the outbound motion and the backlog. The account folder names are redacted on purpose."}, {"t": "2:00-2:55", "h": "The rule that holds it together: work is not finished until it is routed into the map. If a thing exists and is not in the map, the next agent rebuilds it.<br><br>That rule was written the day an agent rebuilt an outbound SOP from scratch, because the one we had was not in the map. [The doc says this cost 45 minutes. There is no claims row for that, so do not say the number until it is signed off.]"}, {"t": "2:55-3:50", "h": "The skills folder. 73 markdown files across eight folders: content, research, ops, miro, lead-gen, youtube, creative-strategy and dm-setting.<br><br>Each folder is an activity, a kind of work that happens every week."}, {"t": "3:50-4:55", "h": "Before and after. Before, you split by client: a folder per client, and the same skill sits inside each one. When the client leaves, the folder rots, and the skill gets rebuilt inside the next client&#x27;s folder.<br><br>After, you split by activity. Content, research, ops. An activity survives every client."}, {"t": "4:55-5:55", "h": "First worked example, the article skills. Six files run in a fixed order and turn any transcript into a published article. A seventh file has one job: keeping the other six honest as new evidence lands.<br><br>Every number they cite lives in one corpus file, built from 41 real captures."}, {"t": "5:55-6:50", "h": "Second worked example, the Monday acquisition analysis. A fixed set of inputs, a fixed structure, a diff against last week on every metric, and registers that carry forward so nothing falls off silently."}, {"t": "6:50-7:45", "h": "The tools folder holds 25 Python scripts. They exist because of one convention: the analysis that produced a number gets saved as a script.<br><br>An inline calculation is gone at the next context clear. Then somebody re-derives it slightly differently, and the two numbers disagree in a meeting."}, {"t": "7:45-8:05", "h": "Part two, the agents. There are four, and every one of them exists because something got missed."}, {"t": "8:05-8:55", "h": "First the difference. A skill runs when I call it. An agent runs without being asked.<br><br>So an agent only makes sense for a job where I already know what good looks like."}, {"t": "8:55-10:00", "h": "This is the worked example for this part. Scar one. Monthly impressions fell 64% between June and August 2026, and nobody noticed for two months.<br><br>That is why the performance-loop agent exists. The bars are indexed to June, so June is 100 and August is 36."}, {"t": "10:00-10:55", "h": "Scar two. A catch-up missed a two-message group DM that held a key number, and it presented an auto-generated queue as if it were the client&#x27;s priorities.<br><br>The signal-sweep agent reads every channel and pulls out the asks, so a buried message does not get lost again."}, {"t": "10:55-11:45", "h": "Scar three. Boards were going out that could not be recorded straight through. The board-qa agent answers one question through fifteen checks: can this be read to camera without stopping."}, {"t": "11:45-12:30", "h": "Scar four is packaging drift. Each lead magnet package came out a little different. The youtube-lead-magnet agent&#x27;s first instruction is to run the existing skill and never invent rules."}, {"t": "12:30-13:25", "h": "Put the four side by side. performance-loop catches a reach drop. signal-sweep catches a missed ask. board-qa catches a board you cannot record. youtube-lead-magnet catches packaging drift.<br><br>Every one of them catches something. None of them reaches out to a human."}, {"t": "13:25-14:20", "h": "The before and after for this whole part. Before, something gets missed, and you find out weeks later. After, the miss becomes a dated rule in the file it governs, and then the rule becomes an agent that checks for it without being asked. And it is not finished."}, {"t": "14:20-14:40", "h": "Part three, what keeps the numbers honest. This is the part that makes the rest worth trusting."}, {"t": "14:40-15:35", "h": "There are nine conventions, and four of them carry the weight. Every claim carries an evidence tag. Every number traces to a script and a dataset. Every script declares its own limit. And decisions are dated lines in the file whose behaviour they govern."}, {"t": "15:35-16:25", "h": "The tags are three words: measured, observed, assumed. An untagged claim is an assertion.<br><br>The 64% drop is measured. The claim that talking beats reading on camera is assumed. You say each one with its tag attached."}, {"t": "16:25-17:30", "h": "Here is why the tags exist. A skill said the worked example was the section that converts. It felt obviously true.<br><br>Then we measured it. The worked example did 60,000. The winning section did 264,000. The opposite direction."}, {"t": "17:30-18:35", "h": "And the scripts state their own limits. One tool was named as if it measured a single account&#x27;s bookings. It measures all inbound, because 649 of 678 Calendly rows sit under one owner, and the UTM field is empty on 673 of them.<br><br>The docstring now says so in capitals. This is also why the 150 calls at the start is a total, with no channel split."}, {"t": "18:35-19:40", "h": "The day, as a before and after. Version two put blocks on the calendar, and a block had no done state, so the end of day guessed what got done and guessed wrong.<br><br>Version three plans from the backlog and pushes tasks into Google Tasks, so a tick is the done state. [On screen: the claims file says 185 tasks pushed from 31 August and 0 ticked. Mauro decides whether that is said on camera.]"}, {"t": "19:40-20:35", "h": "What this system does not do. It does not book calls on its own. Every agent in it is defensive. Nothing in the repo today reaches out to a human.<br><br>That gap is the subject of the next video."}, {"t": "20:35-21:15", "h": "If you run an established agency and want a system like this installed, the offer is called Agency Booked Calls. The link is in the description."}]</script><script>
const frames=[...document.querySelectorAll('.f')];

 frames.forEach(f=>f.querySelectorAll('g[data-s]').forEach(g=>{
  g.querySelectorAll('path.ink').forEach((p,i)=>{const L=Math.ceil(p.getTotalLength())+2;
   p.style.setProperty('--L',L);p.style.setProperty('--d',Math.min(1.1,.25+L/1400)+'s');

 document.querySelectorAll('text[data-maxw]').forEach(t=>{const m=+t.dataset.maxw,L=t.getComputedTextLength();
  if(L>m){t.setAttribute('font-size',(parseFloat(t.getAttribute('font-size'))*m/L).toFixed(1))}});
 document.querySelectorAll('text[data-hl]').forEach(t=>{const [a,n]=t.dataset.hl.split(',').map(Number);
  const x0=t.getStartPositionOfChar(a).x, w=t.getSubStringLength(a,n), bb=t.getBBox();

  r.setAttribute('points',`${x0-10},${y+3} ${x0+w+12},${y-2} ${x0+w+8},${y+h} ${x0-6},${y+h+3}`);
  r.setAttribute('fill','#F3E3A3');r.setAttribute('class','hl');t.parentNode.insertBefore(r,t);});
}
function show(){
 frames.forEach((f,i)=>f.classList.toggle('cur',i===fi));
 const f=frames[fi];
 f.querySelectorAll('g[data-s]').forEach(g=>{const s=+g.dataset.s;
  g.classList.toggle('on',s<=st);
  if(STATIC||nofx||s<st){g.classList.add('done')} else if(s===st){g.classList.remove('done')}
  if(s>st)g.classList.remove('done');});
 const n=NOTES[fi];document.getElementById('notes').innerHTML='<b>FRAME '+(fi+1)+' / '+frames.length+' · '+n.t+'</b>'+n.h;
}
function next(){nofx=false;if(st<maxs(frames[fi])){st++;show()}else if(fi<frames.length-1){fi++;st=0;show()}}
function prev(){if(st>0){st--;nofx=true;show()}else if(fi>0){fi--;st=maxs(frames[fi]);nofx=true;show()}}
addEventListener('keydown',e=>{
 if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();next()}
 else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prev()}
 else if(e.key==='n'||e.key==='N'){document.getElementById('notes').classList.toggle('show')}
 else if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}
});
document.getElementById('stage').addEventListener('click',next);
(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>{prep();if(STATIC)st=maxs(frames[fi]);show()});

<script>

 * self-contained) between the board-corrections start and end HTML comment markers:
 *   growthub-os: python3 boards/inject-corrections.py <board.html> ...
 *   mauro-os:    boards/yt/v2/controls.py puts it in every generated board, before the control bar.
 *
 * Frames: window.YTNAV ({count, index, label}) when the board has a slide adapter (one frame on screen at
 * a time: one "Comment" button for the current frame). Otherwise every [data-frame], else .frame, else
 * <section> gets its own small comment button. Heading = data-frame value, else the first h1-h3/.head.
 *
 * Draft layer: D toggles it. ON = review (elements with class "draft" show, the correction tools show,
 * a DRAFT BOARD badge shows). OFF = recording (all of that is gone). Default ON; headless Chrome and
 * ?static default OFF so renders stay clean; ?draft=on / ?draft=off always win. H hides the tools only.
 * State in localStorage (every access in try/catch), key per board file.

(function () {

  var Q = new URLSearchParams(location.search);

      var ta = box.querySelector('textarea');
      ta.value = notes[n] ? notes[n].t : '';
      function paintBtn() { b.textContent = ta.value.trim() ? '✎ ' + n + ' ●' : '✎ ' + n; b.classList.toggle('has', !!ta.value.trim()); }
      paintBtn();
      keepFocus(b);
      b.addEventListener('click', function (e) { e.stopPropagation(); box.classList.toggle('on'); if (box.classList.contains('on')) ta.focus(); });
      ta.addEventListener('input', function () { setNote(n, h, ta.value); paintBtn(); });
      ['click', 'mousedown', 'wheel'].forEach(function (ev) { box.addEventListener(ev, function (e) { e.stopPropagation(); }); });
      el.appendChild(b); el.appendChild(box);
    });
  }

  function navSync() {
    if (!NAV || !curBox) return;
    var i = NAV.index(), n = i + 1;
    if (curBox.dataset.n === String(n)) return;
    curBox.dataset.n = String(n);
    var h = clean(NAV.label(i)).slice(0, 90) || 'Frame ' + n;
    curBox.dataset.h = h;
    curLab.textContent = 'Frame ' + n + ' · ' + h;
    curTa.value = notes[n] ? notes[n].t : '';
    frameBtn.textContent = '✎ Frame ' + n + (curTa.value.trim() ? ' ●' : '');
  }

  function buildPanel() {
    panel = document.createElement('div'); panel.id = 'bc-panel'; panel.className = 'bc-ui';
    panel.innerHTML = '<div class="row"><span class="ttl"></span>' +
      (NAV ? '<button class="bc-btn" data-a="frame" type="button"></button>' : '') +
      '<button class="bc-btn" data-a="copy" type="button">Copy corrections</button>' +
      '<button class="bc-btn" data-a="dl" type="button">Download corrections</button></div>' +
      (NAV ? '<div class="cur"><b></b><textarea placeholder="What to change in this frame"></textarea></div>' : '') +
      '<div class="msg">D draft layer · H hide tools</div>';
    countEl = panel.querySelector('.ttl'); msgEl = panel.querySelector('.msg');
    keepFocus(panel);
    ['click', 'mousedown', 'wheel'].forEach(function (ev) { panel.addEventListener(ev, function (e) { e.stopPropagation(); }); });
    if (NAV) {
      curBox = panel.querySelector('.cur'); curTa = curBox.querySelector('textarea'); curLab = curBox.querySelector('b');
      frameBtn = panel.querySelector('[data-a=frame]');
      curTa.addEventListener('input', function () {
        setNote(+curBox.dataset.n, curBox.dataset.h, curTa.value);
        frameBtn.textContent = '✎ Frame ' + curBox.dataset.n + (curTa.value.trim() ? ' ●' : '');
      });
      setInterval(navSync, 200); navSync();
    }
    panel.addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      var a = b.dataset.a;
      if (a === 'frame') { curBox.classList.toggle('on'); if (curBox.classList.contains('on')) curTa.focus(); }
      else if (a === 'copy') {
        var t = text();
        var done = function () { flash('Copied ' + lines().length + ' notes'); };
        try {
          navigator.clipboard.writeText(t).then(done, function () { fallbackCopy(t); done(); });
        } catch (err) { fallbackCopy(t); done(); }
      } else if (a === 'dl') {
        try {
          var blob = new Blob([text()], { type: 'text/plain' });
          var u = URL.createObjectURL(blob), l = document.createElement('a');
          l.href = u; l.download = 'board-corrections-' + slug + '-' + new Date().toISOString().slice(0, 10) + '.txt';
          document.body.appendChild(l); l.click(); l.remove(); setTimeout(function () { URL.revokeObjectURL(u); }, 1000);
          flash('Downloaded');
        } catch (err) { flash('Download failed: ' + err); }
      }
    });
    document.body.appendChild(panel);
    paintCount();
  }
  function fallbackCopy(t) {
    var x = document.createElement('textarea'); x.value = t; x.style.position = 'fixed'; x.style.opacity = '0';
    document.body.appendChild(x); x.select(); try { document.execCommand('copy'); } catch (e) {} x.remove();
  }

  var badge;
  function paint() {
    var r = document.documentElement;   // on <html>: some boards rewrite body.className per slide
    r.classList.toggle('draft-off', !draft);
    r.classList.toggle('draft-on', draft);
    r.classList.toggle('bc-hide', hidden);
  }

  // Keys. Registered now, in the capture phase, so it runs before any board handler injected after it.
  window.addEventListener('keydown', function (e) {
    if (isField(e.target) && e.target.closest && e.target.closest('.bc-ui')) {
      if (e.key === 'Escape') e.target.blur();
      e.stopImmediatePropagation();   // typing in a box never moves the board, hides the bar or toggles a layer
      return;
    }
    if (isField(e.target) || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'd' || e.key === 'D') {
      draft = !draft; set(DKEY, draft ? 'on' : 'off'); paint();
    } else if (e.key === 'h' || e.key === 'H') {
      hidden = !hidden; set(HKEY, hidden ? 'on' : 'off'); paint();
    }
  }, true);

  function init() {
    NAV = window.YTNAV || null;
    if (!NAV) buildDom();
    buildPanel();
    badge = document.createElement('div'); badge.id = 'bc-draft'; badge.className = 'draft';
    badge.innerHTML = 'DRAFT BOARD<span>D = recording view</span>';
    document.body.appendChild(badge);
    paint();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { setTimeout(init, 0); });
  else setTimeout(init, 0);
  paint();
})();
</script>

 box-shadow:0 10px 30px rgba(0,0,0,.35);display:none}

<script>
(function(){
const NAV={count:()=>frames.length,index:()=>fi,go:n=>{fi=Math.max(0,Math.min(frames.length-1,n));st=0;nofx=false;show();},next:next,prev:prev,label:k=>NOTES[k].t+' · '+frames[k].textContent.slice(0,90)};
window.YTNAV=NAV;  // board-corrections.js reads the frame count, index and labels from here
const strip=s=>String(s==null?'':s).replace(/<[^>]*>/g,'').replace(/&[a-z#0-9]+;/gi,' ').replace(/\s+/g,' ').trim();
const bar=document.createElement('div');bar.id='ytbar';
bar.innerHTML='<button data-a="prev" title="Previous (Left arrow)">&#9664;</button><span class="ct"></span>'+
 '<button data-a="next" title="Next (Right arrow or Space)">&#9654;</button><button data-a="list" title="Frame list">Frames</button>'+
 '<span class="hk">H hide · N notes · F full</span>';
const list=document.createElement('div');list.id='ytlist';
document.body.appendChild(list);document.body.appendChild(bar);
const ct=bar.querySelector('.ct');
let hidden=/HeadlessChrome/.test(navigator.userAgent)||/[?&]static/.test(location.search);
try{const v=localStorage.getItem('ytbar');if(v!==null&&!hidden)hidden=v==='off';}catch(e){}
function paint(){bar.classList.toggle('off',hidden);if(hidden)list.classList.remove('on');}
function fill(){const n=NAV.count(),c=NAV.index();let h='';
 for(let k=0;k<n;k++){h+='<div data-k="'+k+'"'+(k===c?' class="cur"':'')+'><b>'+(k+1)+'</b> '+strip(NAV.label(k))+'</div>';}
 list.innerHTML=h;}
let last=-1;
function sync(){const c=NAV.index(),n=NAV.count();if(c===last)return;last=c;ct.textContent=(c+1)+' / '+n;
 if(list.classList.contains('on'))fill();}
setInterval(sync,120);
// Keep focus on the document: a click on the bar never focuses a control.
[bar,list].forEach(el=>{el.addEventListener('mousedown',e=>e.preventDefault());
 el.addEventListener('click',e=>{e.stopPropagation();});});
bar.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.a;
 if(a==='prev')NAV.prev();else if(a==='next')NAV.next();
 else if(a==='list'){list.classList.toggle('on');if(list.classList.contains('on')){fill();const cur=list.querySelector('.cur');if(cur)cur.scrollIntoView({block:'center'});}}
 if(document.activeElement&&document.activeElement!==document.body)document.activeElement.blur();sync();});
list.addEventListener('click',e=>{const d=e.target.closest('[data-k]');if(!d)return;NAV.go(+d.dataset.k);list.classList.remove('on');
 if(document.activeElement&&document.activeElement!==document.body)document.activeElement.blur();sync();});
// If anything else took focus (a link, the list), give it back before the format's key handler runs.
addEventListener('keydown',e=>{const a=document.activeElement;
 if(a&&(/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)||a.isContentEditable))return;
 if(a&&a!==document.body&&a!==document.documentElement&&!/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&!a.isContentEditable)a.blur();
 if(e.key==='h'||e.key==='H'){hidden=!hidden;try{localStorage.setItem('ytbar',hidden?'off':'on');}catch(_){}paint();}
 else if(e.key==='Escape'){list.classList.remove('on');}},true);
// #N in the address bar jumps to frame N.
addEventListener('hashchange',()=>{const m=location.hash.match(/\d+/);if(!m)return;const k=parseInt(m[0],10)-1;
 if(k>=0&&k<NAV.count()&&k!==NAV.index())NAV.go(k);});
paint();sync();
})();
</script>
